name: Vince UT24 Noble - OFFICIAL UBPorts Tool
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f
          df -h
      - name: Clone Build Tools
        run: |
          git clone --depth=1 -b main https://gitlab.[STRIPPED 65 bytes].git
          ls halium-build-tools/build.sh
      - name: Setup Vince
        run: |
          mkdir -p vince
          cd vince
          git clone --depth=1 -b ubuntu-touch-24.04 https://github.com/ximiyad123/ubports-garnet template
          cp -r template/* ./
          rm -rf template .git
          echo 'deviceinfo_arch="arm64"' > deviceinfo
          echo 'deviceinfo_bootimg_header_version="2"' >> deviceinfo
          echo 'deviceinfo_devname="vince"' >> deviceinfo
          echo 'deviceinfo_halium_version="13"' >> deviceinfo
          echo 'deviceinfo_kernel_image_name="Image.gz-dtb"' >> deviceinfo
          echo 'deviceinfo_kernel_source="https://github.com/LineageOS/android_kernel_xiaomi_msm8953"' >> deviceinfo
          echo 'deviceinfo_kernel_source_branch="lineage-20"' >> deviceinfo
          echo 'deviceinfo_kernel_config="vince_defconfig"' >> deviceinfo
          cat deviceinfo
      - name: Build
        run: |
          cd vince
          bash ../halium-build-tools/build.sh -b out -d vince
          ls -R out
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: vince-UT24-Noble-OFFICIAL
          path: vince/out
